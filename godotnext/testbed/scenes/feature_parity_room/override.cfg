; Feature Parity Room per-scene project-settings override (#64 step 3).
; Multi-bounce occlusion is restart-only and project-wide, so the harness
; copies this file to res://override.cfg only for this scene and removes
; it afterwards. Do not move this into project.godot: the NextGI baselines
; depend on it staying off.

[rendering]

lights_and_shadows/multi_bounce_occlusion/enabled=true
