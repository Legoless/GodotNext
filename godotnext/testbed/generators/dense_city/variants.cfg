; Dense City Blocks variant targets (#63, plan §13.3 and §2 row 1).
; Read by dense_city_generator.gd at startup; the same values are baked in
; as defaults, so this file documents the targets and lets a later phase
; (for example P5, which may move the geometry-cache budget) retune them in
; one place while keeping the 2x working-set ratio.

[virtual]

instances_min=5000
unique_triangles_min=10000000
reachable_clusters_min=1000000
; Provisional 128 MiB geometry-cache budget (plan v2.2 figure).
geometry_cache_budget_bytes=134217728
working_set_ratio_min=2.0

[kit]

kit_materials=8
kit_triangles_min=500000

[sweeps]

sweep_10m=10000000
sweep_100m=100000000
sweep_1b=1000000000

[stress]

stress_triangles=10000000
